name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first -- no point finishing a
# run for a commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds the backend to dist/, which also type-checks it.
      - run: pnpm run build

      - run: pnpm test

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      # The Python tests import TwitchChannelPointsMiner from vendor/miner
      # (see pyproject.toml pythonpath), so the submodule has to be present.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run pytest
