name: Publish image

on:
  push:
    # A v* tag is the only thing that publishes; see the `push:` input on
    # the build step. A push to main builds the image without pushing it,
    # which stops a broken Dockerfile from lying in wait until the next
    # release -- the worst moment to discover it.
    #
    # paths-ignore is here for main's build check: a Markdown-only commit
    # cannot break the image, so it does not need an emulated arm64 build.
    # If a release ever fails to trigger because its tagged commit touched
    # only docs, run this workflow manually from the tag.
    #
    # Building on pull_request would catch breakage a little earlier still,
    # at the cost of an emulated arm64 build on every PR -- and CI already
    # type-checks and tests the same code there.
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - LICENSE
      # Not a build input either: this file is shipped to users and read
      # by their Docker, never by the image build. Workflow changes under
      # .github/ are deliberately NOT ignored -- a change to this file
      # should get exercised before a tag depends on it.
      - compose.prod.yaml
  workflow_dispatch:

# One run at a time. Two tags pushed in quick succession would otherwise
# have their `latest` land in whichever order the runners happened to
# finish, which is not necessarily release order. Unlike CI, in-progress
# runs are not cancelled: a run that has already pushed a tag is not
# something to interrupt halfway.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build image (publish on tags)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for GITHUB_TOKEN to push to GHCR. The default token is
      # read-only for packages, and the push fails without this.
      packages: write

    steps:
      # The Dockerfile does `COPY vendor/miner vendor/miner`, and the miner
      # is a submodule -- without this the build either fails outright or
      # ships an image whose Start button cannot import the miner.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # arm64 is built under emulation; this registers the QEMU handlers
      # that make the foreign-architecture stages runnable at all.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io wants a lowercase name; github.repository preserves the
      # package.json is the version's source of truth, but the git tag is
      # what triggers this workflow and what metadata-action derives every
      # published image tag from. Nothing enforces that the two agree, and
      # a mismatch would publish :1.2.0 from an app reporting 1.1.0 --
      # silent, and baked into an image that is far harder to take back
      # than a tag. Fail the release before anything is pushed instead.
      - name: Version matches the tag
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(jq -r .version package.json)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "package.json says $manifest but the tag is $tag." >&2
            echo "Bump the manifest to match, or retag." >&2
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"

      # ghcr.io wants a lowercase name; github.repository preserves the
      # case of the owner and repo as they were typed. `vos` is already
      # lowercase today, but a rename or a fork under a capitalised
      # account would push to a path the registry rejects.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # latest=auto is already the default, but it is the whole
          # contract the README's quick start rests on -- spell it out so
          # it cannot change underneath us. `auto` means: attach `latest`
          # to a semver tag build, and to nothing else.
          flavor: latest=auto
          # A v1.2.3 tag publishes 1.2.3, 1.2 and 1, so a user can pin as
          # loosely or as tightly as they like. `latest` tracks the newest
          # release tag (metadata-action's default for semver), which is
          # what the README's quick start tells people to pull -- releases,
          # not the tip of main.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Twitch Miner Control
            org.opencontainers.image.description=A web control panel for Twitch Channel Points Miner
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Publish only from a v* tag. A push to main still builds
          # everything above this line, so the build is verified, but the
          # result is thrown away rather than moving any published tag.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Read out of package.json by the guard above, not off the ref:
          # the manifest is the source of truth, and on a tagged build the
          # guard has already proved the two agree. The guard does not run
          # on main, so an untagged build passes an empty value here and
          # the app reports "dev" -- correct, since an unreleased image
          # should not claim a release number.
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          # better-sqlite3 compiles a native addon and the frontend build
          # is a full Vite run, both of which are wasted work when the
          # layer inputs have not changed. GitHub's cache is scoped per
          # branch, so main's cache is the one that stays warm.
          cache-from: type=gha
          cache-to: type=gha,mode=max
