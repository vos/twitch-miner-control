# Runs the published image -- no clone, no submodule, no build toolchain.
#
# The README's quick start has you download this file as `compose.yaml`,
# so the usual command just works:
#
#     docker compose up -d
#
# It keeps the `.prod` name here only to sit alongside the repository's own
# compose.yaml, which builds the image from a source checkout instead --
# that one is for changing the code, not for running the app.
#
services:
  twitch-miner-control:
    image: ghcr.io/vos/twitch-miner-control:latest
    container_name: twitch-miner-control
    init: true            # reap orphaned Python children
    ports:
      # Publishing on every interface is what makes this reachable from
      # other machines on your LAN, which is the point. It is also why the
      # README says not to port-forward it. Behind a reverse proxy, change
      # this to "127.0.0.1:8080:8080".
      - "8080:8080"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      # The timezone the miner's log timestamps are written in. Defaults to
      # UTC to match the image; set TZ in .env to a tz database name such as
      # Europe/Berlin to read the Logs page in local time.
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data
    restart: unless-stopped
