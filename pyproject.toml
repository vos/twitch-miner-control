[project]
name = "twitch-miner-control-helpers"
version = "0.1.0"
requires-python = ">=3.12"
license = "GPL-3.0-only"

# Mirrors vendor/miner's own dependency list. The submodule is imported off
# sys.path rather than pip-installed, so nothing else declares what it needs
# at runtime -- only `requests` is imported by our code in python/. Keep this
# in sync when bumping the submodule; upstream's dev-only `pre-commit` is
# deliberately omitted.
dependencies = [
    "colorama>=0.4.6",
    "emoji>=2.15.0",
    "flask>=3.1.3",
    "irc>=20.5.0",
    "millify>=0.1.1",
    "pandas>=3.0.3",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2026.2",
    "requests>=2.34.2",
    "validators>=0.35.0",
    "websocket-client>=1.9.0",
    "werkzeug>=3.1.8",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = [".", "python", "vendor/miner"]
